server.port=8081
spring.application.name=transaction-service

# Inter-service communication URL via internal Docker DNS
account.service.url=${ACCOUNT_SERVICE_URL:http://account-service:8080}

# H2 In-Memory Database Configuration for Transactions
spring.datasource.url=jdbc:h2:mem:transaction_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
